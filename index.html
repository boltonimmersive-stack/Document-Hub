-radius:13px;padding:27px;width:min(620px,93vw);box-shadow:0 10px 80px #1113;color:var(--ink)}dialog::backdrop{background:#19152f77}dialog h2{margin-top:0}dialog .footer{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.sampledoc{border:2px solid #d9d3e7;padding:30px;min-height:260px;text-align:center;position:relative;overflow:hidden}.sampledoc .watermark{font-size:36px;color:#e6e0f0;letter-spacing:4px;margin:16px 0;font-weight:800}.sampledoc h3{font-size:22px;color:var(--purple)}.sampledoc p{font-size:12px}.checkbox{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:12px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#252139;color:white;padding:13px 22px;border-radius:9px;z-index:70;max-width:90vw;box-shadow:0 8px 30px #1113;font-size:13px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}.receipt{padding:12px 15px;border:1px solid #b4dbcb;background:#eef8f3;border-radius:7px;color:#206b52;margin:12px 0;font-size:12px}.mobile-label{display:none}@media(min-width:1550px){.board{gap:18px}.candidatecard{padding:18px}}@media(max-width:1100px){.app{grid-template-columns:170px 1fr}.sidebar{padding:22px 13px}.brand{font-size:14px}.maincontent{padding:25px 22px}.topbar{padding:0 22px}.stats{gap:10px}.stat{padding:14px}.candidate-layout{grid-template-columns:1fr}.candidate-aside{display:grid;grid-template-columns:1fr 1fr;gap:15px}.board{grid-template-columns:repeat(5,205px)}}@media(max-width:720px){.app{display:block}.sidebar{padding:14px 18px;gap:12px}.sidebar nav{display:flex;gap:6px}.sidebar nav button{padding:8px}.sidebarfooter,.sidebar .workspacelabel{display:none}.topbar{height:auto;min-height:65px;flex-wrap:wrap;padding:13px 18px}.maincontent{padding:22px 16px}.heading{align-items:flex-start;flex-direction:column}h1{font-size:26px}.stats{grid-template-columns:1fr 1fr}.stat strong{font-size:25px}.controls select{max-width:100%}.toggle{margin-left:0}. </style></head><body>
<div class="demo-bar"><strong>Interactive prototype</strong><span>Fictional records · uploads and reminders are simulated · use sample documents only</span></div>
<div class="app"><aside class="sidebar"><div class="brand"><span class="brandmark">✓</span><span>Document Hub</span></div><div class="workspacelabel"><small>RECRUITMENT WORKSPACE</small></div><nav aria-label="Workspace"><button id="hrNav" class="active">▦ &nbsp; HR dashboard</button><button id="candidateNav">▤ &nbsp; Candidate portal</button><button id="guideNav">? &nbsp; Demo guide</button></nav><div class="sidebarfooter"><strong>Your College</strong>Document collection & review<br><br>Session-only demo.<br>Export demo progress to keep it.</div></aside><main class="main"><header class="topbar"><span class="breadcrumb" id="breadcrumb">Recruitment / Document tracking</span><div class="persona"><span class="avatar" id="avatar">HR</span><span id="personaName">HR team</span><button class="small" id="reset">Reset demo</button></div></header><div class="maincontent" id="content"></div></main></div>
<div id="overlay" hidden></div><dialog id="modal"></dialog><input type="file" id="files" accept=".pdf,.png,.jpg,.jpeg" multiple hidden><input type="file" id="importFile" accept=".json,application/json" hidden><div id="toast" role="status" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s),e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={missing:'Awaiting upload',received:'Received · review due',replacement:'Replacement needed',verified:'Verified by staff',na:'Not required'};
const stages=[['awaiting','Awaiting documents'],['partial','Part received'],['ready','Ready for review'],['action','Action needed'],['complete','Document checks complete']];
const defs=[{key:'qualification',name:'Qualification certificate',kind:'Qualification',help:'Upload the qualification certificate requested for this role.'},{key:'identity',name:'Identity document',kind:'Identity',help:'Provide the identity evidence specified in your invitation. Sample documents only in this demo.'},{key:'address',name:'Address evidence',kind:'Identity',help:'Provide the requested address evidence. Use the guidance in your invitation.'},{key:'registration',name:'Professional registration',kind:'Qualification',help:'Evidence of the professional registration requested for this vacancy.'}];
function iso(n=0){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function now(){return new Date().toISOString()}function day(d){return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}function timestamp(d){return new Date(d).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function makeDoc(key,status){const d=defs.find(x=>x.key===key);return{...d,status,filename:['received','verified','replacement'].includes(status)?'SAMPLE_'+key+'.pdf':'',size:128000,version:status==='missing'||status==='na'?0:1,feedback:status==='replacement'?'Please provide a clearer copy showing the whole document, including all corners.':'',checkedAt:status==='verified'?now():'',checkedBy:status==='verified'?'HR reviewer (demo)':'',receivedAt:['received','verified','replacement'].includes(status)?now():''}}
function seed(){const records=[['Alex Morgan','Student Services Administrator','SS-014','Kim','awaiting',5,['missing','missing','missing','na']],['Priya Shah','Finance Assistant','FN-009','Cheryl','partial',2,['verified','received','missing','na']],['Jamie Wilson','Learning Support Assistant','LS-022','Kim','ready',4,['received','received','received','na']],['Taylor Evans','Facilities Coordinator','ES-007','Cheryl','action',-2,['verified','replacement','received','na']],['Samira Ali','HR Administrator','HR-012','Kim','complete',3,['verified','verified','verified','na']],['Jordan Clarke','IT Technician','IT-018','Cheryl','partial',-1,['received','missing','verified','na']],['Robin Patel','Lecturer in Engineering','EN-031','Kim','ready',6,['verified','received','verified','received']],['Casey Brown','Business Support Officer','BS-011','Cheryl','awaiting',8,['missing','missing','missing','na']]];return records.map((r,i)=>({id:'C'+String(i+101),name:r[0],role:r[1],vacancy:r[2],owner:r[3],deadline:iso(r[5]),docs:defs.map((d,j)=>makeDoc(d.key,r[6][j])),events:[{at:now(),actor:'System demo',text:'Document checklist created. Candidate invitation simulated.'}],lastReminder:'',receipt:''}))}
let candidates=seed(),mode='hr',view='board',selectedId='C101',detailId=null,search='',vacancyFilter='',ownerFilter='',quick='',queue=[],pendingDoc='',toastTimer,dirty=false;
const byId=id=>candidates.find(c=>c.id===id),selected=()=>byId(selectedId),required=c=>c.docs.filter(d=>d.status!=='na'),verified=c=>required(c).filter(d=>d.status==='verified').length;
function stage(c){const a=required(c);if(!a.length)return'awaiting';if(a.every(d=>d.status==='verified'))return'complete';if(a.some(d=>d.status==='replacement'))return'action';if(a.every(d=>['received','verified'].includes(d.status)))return'ready';if(a.some(d=>['received','verified'].includes(d.status)))return'partial';return'awaiting'}
function overdue(c){return c.deadline<iso()&&stage(c)!=='complete'}function badge(s){return`<span class="badge ${s}">${labels[s]}</span>`}function log(c,text,actor='HR reviewer (demo)'){c.events.unshift({at:now(),actor,text});dirty=true}function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,5000)}
function progress(c){const n=required(c).length,v=verified(c);return`<div class="line smalltext"><span>${v} of ${n} verified</span><span>${n?Math.round(v/n*100):0}%</span></div><div class="progress" aria-label="${v} of ${n} documents verified"><span style="width:${n?v/n*100:0}%"></span></div>`}
function filter(){return candidates.filter(c=>(!search||[c.name,c.id,c.role,c.vacancy].join(' ').toLowerCase().includes(search.toLowerCase()))&&(!vacancyFilter||c.vacancy===vacancyFilter)&&(!ownerFilter||c.owner===ownerFilter)&&(!quick||quick==='overdue'&&overdue(c)||quick===stage(c)))}
function card(c){return `<button class="candidatecard" data-open="${c.id}"><div class="ref">${c.id} · ${e(c.vacancy)}</div><h3>${e(c.name)}</h3><p>${e(c.role)}</p><div class="docdots" aria-label="Document status">${required(c).map(d=>`<span class="docdot ${d.status}" title="${e(d.name)}: ${labels[d.status]}"></span>`).join('')}</div><div class="line info"><span>${verified(c)}/${required(c).length} verified</span><span>${e(c.owner)}</span></div><div style="margin-top:9px" class="${overdue(c)?'overdue':'due'}">${overdue(c)?'Overdue · ':stage(c)==='complete'?'Checks complete · ':'Due '}${day(c.deadline)}</div></button>`}
function hr(){const all=candidates.length,ready=candidates.filter(c=>stage(c)==='ready').length,late=candidates.filter(overdue).length,done=candidates.filter(c=>stage(c)==='complete').length;return `<div class="heading"><div><div class="eyebrow">HR overview</div><h1>Every candidate. A clear next step.</h1><p class="muted">Track receipt, review documents and follow up on what is missing.</p></div><div class="actions"><button data-act="import">Open demo progress</button><button data-act="save">Save demo progress</button><button class="primary" data-act="csv">Export tracker CSV</button></div></div><div class="stats"><button class="stat ${!quick?'active':''}" data-quick=""><span>Active candidates</span><strong>${all}</strong><em>Across ${new Set(candidates.map(c=>c.vacancy)).size} vacancies</em></button><button class="stat ${quick==='ready'?'active':''}" data-quick="ready"><span>Ready for review</span><strong class="accent">${ready}</strong><em>All requested documents received</em></button><button class="stat ${quick==='overdue'?'active':''}" data-quick="overdue"><span>Overdue</span><strong class="danger">${late}</strong><em>Follow-up needed</em></button><button class="stat ${quick==='complete'?'active':''}" data-quick="complete"><span>Document checks complete</span><strong class="success">${done}</strong><em>All required documents verified</em></button></div><div class="controls"><label class="search"><span class="sr">Search candidates</span><input id="search" placeholder="Search name, reference or vacancy…" value="${e(search)}"></label><label><span class="sr">Vacancy filter</span><select id="vacancyFilter"><option value="">All vacancies</option>${[...new Set(candidates.map(c=>c.vacancy))].map(v=>`<option ${v===vacancyFilter?'selected':''}>${e(v)}</option>`).join('')}</select></label><label><span class="sr">Staff owner filter</span><select id="ownerFilter"><option value="">All reviewers</option>${[...new Set(candidates.map(c=>c.owner))].map(v=>`<option ${v===ownerFilter?'selected':''}>${e(v)}</option>`).join('')}</select></label><button class="small" data-act="clearFilters">Clear filters</button><div class="toggle" aria-label="Dashboard view"><button data-view="board" class="${view==='board'?'active':''}">Board</button><button data-view="table" class="${view==='table'?'active':''}">Table</button></div></div><div id="results">${results()}</div><div class="legend"><span><i style="background:#d9ddea"></i>Awaiting upload</span><span><i style="background:#8c7bcc"></i>Received</span><span><i style="background:#d5846c"></i>Replacement needed</span><span><i style="background:#36a28b"></i>Verified</span><span>Stages update from document statuses.</span></div>`}
function results(){const list=filter();if(view==='board')return `<div class="smalltext muted" style="margin-bottom:12px">${list.length} candidate${list.length===1?'':'s'} shown${quick?' · filtered':''}</div><div class="board">${stages.map(([k,n])=>`<section class="column" data-stage="${k}"><div class="col-accent"></div><div class="columnhead">${n}<span>${list.filter(c=>stage(c)===k).length}</span></div>${list.filter(c=>stage(c)===k).map(card).join('')||'<p class="empty">No candidates</p>'}</section>`).join('')}</div>`;return `<div class="tablewrap"><table><thead><tr><th>Candidate</th><th>Vacancy</th>${defs.map(d=>`<th>${d.name}</th>`).join('')}<th>Progress</th><th>Due / reviewer</th></tr></thead><tbody>${list.map(c=>`<tr><td><button class="name" data-open="${c.id}"><strong>${e(c.name)}</strong><br>${c.id}</button></td><td>${e(c.vacancy)}<br><span class="muted">${e(c.role)}</span></td>${c.docs.map(d=>`<td>${badge(d.status)}</td>`).join('')}<td style="min-width:150px">${progress(c)}</td><td><span class="${overdue(c)?'overdue':'due'}">${day(c.deadline)}</span><br>${e(c.owner)}</td></tr>`).join('')||'<tr><td colspan="8">No candidates match these filters.</td></tr>'}</tbody></table></div>`}
function portal(){const c=selected(),n=required(c).length,received=required(c).filter(d=>['received','verified'].includes(d.status)).length;return `<div class="heading"><div><div class="eyebrow">Candidate experience</div><h1>Your documents, all in one place</h1><p class="muted">A preview of the candidate journey. Select a fictional candidate to explore.</p></div><label class="field" style="margin:0;min-width:220px"><span>Demo candidate</span><select id="candidateSelect" style="width:100%">${candidates.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${e(x.name)} · ${x.id}</option>`).join('')}</select></label></div><div class="portalheader"><div class="eyebrow">${e(c.vacancy)} · ${c.id}</div><h1>Hello, ${e(c.name.split(' ')[0])}.</h1><p class="muted">${e(c.role)}<br>Please provide the documents below by ${day(c.deadline)}.</p><div class="line smalltext" style="margin-top:20px"><span>${received} of ${n} documents received or verified</span><span>${verified(c)} verified by HR</span></div><div class="progress"><span style="width:${n?received/n*100:0}%"></span></div></div><div class="candidate-layout"><div><div class="panel"><div class="line"><div><h2>Your document checklist</h2><p class="muted smalltext">Received files are checked by a member of staff.</p></div><span class="badge ${stage(c)==='complete'?'verified':'missing'}">${stage(c)==='complete'?'All document checks complete':overdue(c)?'Deadline passed':'In progress'}</span></div>${c.receipt?`<div class="receipt">Submission recorded in this demo · ${e(c.receipt)}<br>You can add missing documents or replace a file below.</div>`:''}${c.docs.map(d=>`<div class="docrow"><div class="docicon">${d.kind==='Identity'?'ID':'CERT'}</div><div class="docbody"><div class="line"><h3>${e(d.name)}</h3>${badge(d.status)}</div><p>${e(d.help)}</p>${d.filename?`<div class="filename">${e(d.filename)} · version ${d.version}</div>`:''}${d.feedback&&d.status==='replacement'?`<div class="feedback"><strong>Message from HR</strong><br>${e(d.feedback)}</div>`:''}${d.status==='verified'?'<div class="info">Checked by HR. No further upload needed.</div>':''}${d.status==='na'?'<div class="info">No document requested for this vacancy.</div>':''}</div>${!['verified','na'].includes(d.status)?`<button class="small" data-upload="${d.key}">${d.filename?'Replace file':'Add file'}</button>`:''}</div>`).join('')}</div><div class="panel"><h2>Add your documents</h2><p class="muted smalltext">Select several sample files together, then match each one to the checklist.</p><div class="dropzone" id="dropzone"><strong>Drop sample documents here</strong><p>PDF, PNG or JPEG · up to 10 MB per file · 10 files at a time</p><div class="actions" style="justify-content:center"><button class="primary" data-act="browse">Choose sample files</button><button data-act="demoBatch">Use fictional sample files</button></div></div><div id="queue">${queueHtml()}</div></div></div><aside class="candidate-aside"><div class="panel"><h3>Three simple steps</h3><div class="step"><b>1</b><div><strong class="smalltext">Choose your files</strong><p>Use clear scans or photos of the documents requested.</p></div></div><div class="step"><b>2</b><div><strong class="smalltext">Match and submit</strong><p>Choose the document type for each file and submit together.</p></div></div><div class="step"><b>3</b><div><strong class="smalltext">Track the checks</strong><p>See when documents are received, verified or need replacing.</p></div></div></div><div class="panel"><h3>Need a hand?</h3><p class="smalltext muted">Your recruitment contact can explain which evidence is required or arrange another way to provide it.</p><button data-act="help">View example support message</button></div><div class="banner">Prototype only. File names are recorded for this browser session; file contents are not uploaded or retained. Do not select real identity documents.</div></aside></div>`}
function queueHtml(){if(!queue.length)return '<p class="info">No files selected yet. Try “Use fictional sample files” for a quick demonstration.</p>';return queue.map((q,i)=>`<div class="queueitem"><div class="line"><span class="filename">${e(q.name)}</span><button class="small" data-remove="${i}" aria-label="Remove ${e(q.name)}">Remove</button></div><div class="info">${q.size<1024*1024?Math.round(q.size/1024)+' KB':(q.size/1024/1024).toFixed(1)+' MB'} · filename only</div><label><span class="sr">Document type for ${e(q.name)}</span><select data-map="${i}"><option value="">Choose document type…</option>${required(selected()).filter(d=>d.status!=='verified').map(d=>`<option value="${d.key}" ${q.key===d.key?'selected':''}>${e(d.name)}</option>`).join('')}</select></label></div>`).join('')+`<div class="actions" style="margin-top:14px"><button class="primary" data-act="submit">Submit ${queue.length} sample file${queue.length===1?'':'s'}</button><button data-act="clearQueue">Clear selection</button></div><p class="info">This simulates a submission. Your HR dashboard updates immediately.</p>`}
function render(){const hrmode=mode==='hr';$('#hrNav').classList.toggle('active',hrmode);$('#candidateNav').classList.toggle('active',!hrmode);$('#breadcrumb').textContent=hrmode?'Recruitment / Document tracking':'Candidate portal / Document checklist';$('#personaName').textContent=hrmode?'HR team':'Candidate preview';$('#avatar').textContent=hrmode?'HR':selected().name.split(' ').map(x=>x[0]).join('');$('#content').innerHTML=hrmode?hr():portal();if(!hrmode)wireDrop()}
function candidateDetail(){const c=byId(detailId);if(!c){closeDrawer();return}$('#overlay').hidden=false;$('#overlay').innerHTML=`<div class="backdrop" data-act="closeDrawer"></div><section class="drawer" role="dialog" aria-modal="true" aria-label="Candidate review" tabindex="-1"><header class="drawerhead"><div><div class="eyebrow">${c.id} · ${e(c.vacancy)}</div><h2>${e(c.name)}</h2><div class="muted smalltext">${e(c.role)}</div></div><button data-act="closeDrawer" aria-label="Close candidate review">✕</button></header><div class="drawerbody"><div class="line"><span class="badge ${stage(c)==='complete'?'verified':stage(c)==='action'?'replacement':'received'}">${stages.find(([k])=>k===stage(c))[1]}</span><span class="${overdue(c)?'overdue':'due'}">Due ${day(c.deadline)} · ${e(c.owner)}</span></div><div style="margin:18px 0">${progress(c)}</div><div class="actions"><button class="primary" data-act="previewCandidate">Preview candidate view</button><button data-act="reminder">Draft reminder</button><button data-act="requirements">Edit checklist</button></div><p class="info" style="margin-top:14px">Review actions simulate staff checks only. This prototype does not authenticate identity, validate qualifications or complete right-to-work checks.</p>${c.docs.map(d=>`<div class="docrow"><div class="docicon">${d.kind==='Identity'?'ID':'CERT'}</div><div class="docbody"><div class="line"><h3>${e(d.name)}</h3>${badge(d.status)}</div>${d.filename?`<div class="filename">${e(d.filename)} · v${d.version}</div>`:'<p>No file received.</p>'}${d.status==='verified'?`<p class="info">${e(d.checkedBy)} · ${timestamp(d.checkedAt)}</p>`:''}${d.status==='replacement'?`<div class="feedback">${e(d.feedback)}</div>`:''}${d.filename?`<button class="text smalltext" data-sample="${d.key}">View fictional sample</button>`:''}${['received','replacement'].includes(d.status)?`<div class="docreview"><label for="note-${d.key}">Reviewer note / replacement reason</label><textarea id="note-${d.key}" placeholder="For example: please upload a clearer copy…">${d.status==='replacement'?e(d.feedback):''}</textarea><div class="actions" style="margin-top:8px"><button class="small good" data-verify="${d.key}">Mark verified (demo)</button><button class="small" data-replace="${d.key}">Request replacement</button></div></div>`:d.status==='verified'?`<button class="text smalltext" data-reopen="${d.key}">Reopen review</button>`:''}</div></div>`).join('')}<div class="timeline"><h3>Activity history</h3>${c.events.slice(0,30).map(a=>`<div class="event"><time>${timestamp(a.at)} · ${e(a.actor)}</time><p>${e(a.text)}</p></div>`).join('')}</div></div></section>`;document.body.style.overflow='hidden'}
function closeDrawer(){detailId=null;$('#overlay').hidden=true;$('#overlay').innerHTML='';document.body.style.overflow='';const target=$(`[data-open="${selectedId}"]`);if(target)target.focus()}
function modal(title,body,footer=''){const d=$('#modal');d.innerHTML=`<h2>${e(title)}</h2>${body}<div class="footer">${footer}<button data-act="closeModal">Close</button></div>`;d.showModal()}
function demoBatch(){const available=required(selected()).filter(d=>!['verified','received'].includes(d.status));if(!available.length)return toast('No missing or replacement documents. Use individual Replace file controls to resubmit received files.');queue=available.map(d=>({name:'SAMPLE_'+d.key+'.pdf',size:164000,key:d.key}));$('#queue').innerHTML=queueHtml();toast('Fictional files added. Review the document types and submit.')}
function receiveFiles(list){const accepted=[],rejected=[];for(const f of Array.from(list).slice(0,10)){if(!/\.(pdf|png|jpe?g)$/i.test(f.name)||!['application/pdf','image/png','image/jpeg',''].includes(f.type)||f.size>10*1024*1024||f.size===0){rejected.push(f.name);continue}const available=required(selected()).filter(d=>d.status!=='verified');let guess=pendingDoc||available.find(d=>f.name.toLowerCase().includes(d.key))?.key||'';accepted.push({name:f.name.slice(0,180),size:f.size,key:guess})}queue.push(...accepted);queue=queue.slice(0,10);pendingDoc='';$('#queue').innerHTML=queueHtml();if(rejected.length)toast('Some files were skipped. Use non-empty PDF, PNG or JPEG files up to 10 MB.');else toast(`${accepted.length} sample file(s) selected. No file contents retained.`);$('#queue').scrollIntoView({behavior:'smooth',block:'center'})}
function wireDrop(){const z=$('#dropzone');if(!z)return;z.ondragover=ev=>{ev.preventDefault();z.classList.add('dragover')};z.ondragleave=()=>z.classList.remove('dragover');z.ondrop=ev=>{ev.preventDefault();z.classList.remove('dragover');receiveFiles(ev.dataTransfer.files)}}
function submit(){if(!queue.length)return;if(queue.some(q=>!q.key))return toast('Choose a document type for every file.');if(new Set(queue.map(q=>q.key)).size!==queue.length)return toast('Choose one file per document type in this prototype. Combine multi-page evidence into one sample PDF.');const c=selected();if(queue.some(q=>!c.docs.some(d=>d.key===q.key&&!['verified','na'].includes(d.status))))return toast('A selected document no longer needs uploading. Clear the selection and try again.');for(const q of queue){const d=c.docs.find(d=>d.key===q.key);d.filename=q.name;d.size=q.size;d.status='received';d.version++;d.receivedAt=now();d.feedback='';d.checkedAt='';d.checkedBy='';log(c,`${d.name} received (version ${d.version}).`,'Candidate (demo)')}c.receipt='DEMO-'+c.id+'-'+Date.now().toString(36).toUpperCase();queue=[];render();toast('Sample submission recorded. Documents are now awaiting HR review.')}
function verify(key){const c=byId(detailId),d=c.docs.find(x=>x.key===key);if(!['received','replacement'].includes(d.status))return;d.status='verified';d.feedback='';d.checkedAt=now();d.checkedBy='HR reviewer (demo)';log(c,d.name+' marked verified in demo.');render();candidateDetail();toast(stage(c)==='complete'?'All required document checks complete in demo.':d.name+' marked verified in demo.')}
function replacement(key){const c=byId(detailId),d=c.docs.find(x=>x.key===key),note=$('#note-'+key).value.trim();if(!note)return toast('Add a reason so the candidate knows what to replace.');d.status='replacement';d.feedback=note.slice(0,1000);d.checkedAt='';d.checkedBy='';log(c,'Replacement requested for '+d.name+': '+d.feedback);render();candidateDetail();toast('Replacement request added to the candidate checklist. No email sent.')}
function reminder(){const c=byId(detailId),outstanding=required(c).filter(d=>['missing','replacement'].includes(d.status));const text=outstanding.length?`Hello ${c.name.split(' ')[0]},\n\nPlease provide the following outstanding documents for ${c.role} (${c.vacancy}):\n\n${outstanding.map(d=>'• '+d.name+(d.status==='replacement'?' — '+d.feedback:'')).join('\n')}\n\nRequested deadline: ${day(c.deadline)}.\nPlease use your candidate document portal to provide them.\n\nIf you need help, please contact the recruitment team.\n\nThank you,\nRecruitment team`:`Hello ${c.name.split(' ')[0]},\n\nNo further document uploads are currently outstanding for ${c.role}. ${stage(c)==='complete'?'All requested document checks are complete.':'Your submitted documents are awaiting review.'}\n\nThank you,\nRecruitment team`;modal('Candidate reminder draft',`<p class="muted smalltext">Only missing documents and replacement requests are included. This prototype sends no messages.</p><textarea id="reminderText" aria-label="Reminder draft" style="min-height:290px">${e(text)}</textarea>`,`<button data-act="copyReminder">Copy draft</button><button class="primary" data-act="recordReminder">Record simulated reminder</button>`)}
function requirements(){const c=byId(detailId);modal('Edit requested documents',`<p class="smalltext muted">Choose the evidence requested for this fictional vacancy. Removing a requirement clears its demo receipt details.</p>${c.docs.map(d=>`<label class="checkbox"><input type="checkbox" data-required="${d.key}" ${d.status!=='na'?'checked':''}>${e(d.name)}</label>`).join('')}<label class="field"><span>Document deadline</span><input type="date" id="deadlineInput" value="${c.deadline}"></label>`,`<button class="primary" data-act="saveRequirements">Save checklist</button>`)}
function saveRequirements(){const c=byId(detailId),checks=[...document.querySelectorAll('[data-required]')];if(!checks.some(x=>x.checked))return toast('Request at least one document.');const deadline=$('#deadlineInput').value;if(!deadline)return toast('Choose a deadline.');checks.forEach(x=>{const d=c.docs.find(d=>d.key===x.dataset.required);if(!x.checked&&d.status!=='na')Object.assign(d,makeDoc(d.key,'na'));if(x.checked&&d.status==='na')Object.assign(d,makeDoc(d.key,'missing'))});c.deadline=deadline;log(c,'Document checklist and deadline updated.');$('#modal').close();render();candidateDetail()}
function sample(key){const c=byId(detailId),d=c.docs.find(d=>d.key===key);modal('Fictional document preview',`<div class="sampledoc"><div class="eyebrow">Demonstration evidence</div><div class="watermark">SAMPLE ONLY</div><h3>${e(d.name)}</h3><p>${e(c.name)} · ${c.id}</p><p>This is a fictional placeholder.<br>No identity document or real certificate is displayed.</p></div><p class="info" style="margin-top:14px">Selected local files are represented by filename only. This sample is not the selected file and does not prove identity or qualifications.</p>`)}
function download(name,text,mime){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:mime}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function csv(){const rows=[['Candidate reference','Name (fictional)','Vacancy','Role','Reviewer','Due','Stage','Required','Verified',...defs.map(d=>d.name)],...filter().map(c=>[c.id,c.name,c.vacancy,c.role,c.owner,c.deadline,stages.find(([k])=>k===stage(c))[1],required(c).length,verified(c),...c.docs.map(d=>labels[d.status])])];const quote=v=>{let x=String(v);if(/^[=+@\-\t\r]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};download('candidate-document-tracker-demo.csv','\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('Tracker CSV downloaded for the current filters.')}
function save(){download('candidate-hub-demo-progress.json',JSON.stringify({kind:'candidate-hub-demo',version:1,candidates},null,2),'application/json');dirty=false;toast('Demo progress downloaded. No document contents are included.')}
function validateData(o){if(!o||o.kind!=='candidate-hub-demo'||o.version!==1||!Array.isArray(o.candidates)||!o.candidates.length||o.candidates.length>100)throw Error('Choose a Candidate Hub version 1 demo progress file.');const str=(v,max=1000)=>{if(typeof v!=='string'||v.length>max)throw Error('Invalid text field.');return v};const seen=new Set();return o.candidates.map(c=>{const out={};for(const k of ['id','name','role','vacancy','owner','deadline','lastReminder','receipt'])out[k]=str(c[k],250);if(!/^C\d{3,6}$/.test(out.id)||seen.has(out.id))throw Error('Invalid or duplicate candidate reference.');seen.add(out.id);if(!/^\d{4}-\d{2}-\d{2}$/.test(out.deadline)||Number.isNaN(+new Date(out.deadline)))throw Error('Invalid deadline.');if(!Array.isArray(c.docs)||c.docs.length!==defs.length)throw Error('Invalid document checklist.');out.docs=defs.map(def=>{const d=c.docs.find(x=>x.key===def.key);if(!d||!Object.hasOwn(labels,d.status))throw Error('Invalid document status.');if(!Number.isInteger(d.version)||d.version<0||d.version>10000||!Number.isFinite(d.size)||d.size<0||d.size>10485760)throw Error('Invalid document metadata.');const n={...def,status:d.status,version:d.version,size:d.size};for(const k of ['filename','feedback','checkedAt','checkedBy','receivedAt'])n[k]=str(d[k],k==='feedback'?1000:250);for(const k of ['checkedAt','receivedAt'])if(n[k]&&Number.isNaN(+new Date(n[k])))throw Error('Invalid activity date.');if(['received','replacement','verified'].includes(n.status)&&(!n.filename||!n.receivedAt||n.version<1))throw Error('Received documents need receipt details.');if(n.status==='verified'&&(!n.checkedBy||!n.checkedAt))throw Error('Verified document is missing review details.');return n});if(!Array.isArray(c.events)||c.events.length>1000)throw Error('Invalid activity history.');out.events=c.events.map(a=>{const at=str(a.at,100);if(Number.isNaN(+new Date(at)))throw Error('Invalid activity date.');return{at,actor:str(a.actor,250),text:str(a.text,1500)}});return out})}
async function openProgress(file){if(!file)return;if(file.size>3*1024*1024)return toast('Progress file is too large. Maximum 3 MB.');try{const next=validateData(JSON.parse(await file.text()));if(!confirm('Replace current demo progress with this saved file?'))return;candidates=next;selectedId=candidates[0].id;queue=[];search='';quick='';vacancyFilter='';ownerFilter='';closeDrawer();dirty=false;render();toast('Saved demo progress restored.')}catch(err){toast('Could not open progress: '+err.message)}}
function guide(){modal('Try the full journey',`<div class="step"><b>1</b><div><strong>Upload as a candidate</strong><p>Open Alex Morgan’s card and choose Preview candidate view. Click Use fictional sample files, then Submit.</p></div></div><div class="step"><b>2</b><div><strong>Review as HR</strong><p>Switch to HR dashboard. Alex moves into Ready for review. Open the card and mark a document verified.</p></div></div><div class="step"><b>3</b><div><strong>Request a replacement</strong><p>Add a reviewer note to an identity document and choose Request replacement. Preview the candidate view to see that feedback.</p></div></div><div class="step"><b>4</b><div><strong>Finish the checks</strong><p>Resubmit the sample document, then verify every required item. The card moves into Document checks complete.</p></div></div><div class="banner">This single-file prototype has no accounts, secure document repository, email delivery or live connection to an HR system. Mode switching demonstrates two experiences; it is not access control. Progress stays in this session unless exported. Identity evidence review does not replace formal identity or right-to-work processes.</div>`)}
function setMode(v){mode=v;queue=[];closeDrawer();render();window.scrollTo(0,0)}
document.addEventListener('click',ev=>{const b=ev.target.closest('button,[data-act]');if(!b)return;if(b.dataset.open){selectedId=b.dataset.open;detailId=b.dataset.open;candidateDetail();$('.drawer button').focus();return}if(b.hasAttribute('data-quick')){quick=b.dataset.quick;render();return}if(b.dataset.view){view=b.dataset.view;render();return}if(b.dataset.upload){pendingDoc=b.dataset.upload;$('#files').click();return}if(b.hasAttribute('data-remove')){queue.splice(+b.dataset.remove,1);$('#queue').innerHTML=queueHtml();return}if(b.dataset.verify){verify(b.dataset.verify);return}if(b.dataset.replace){replacement(b.dataset.replace);return}if(b.dataset.sample){sample(b.dataset.sample);return}if(b.dataset.reopen){const c=byId(detailId),d=c.docs.find(x=>x.key===b.dataset.reopen);d.status='received';d.checkedAt='';d.checkedBy='';log(c,d.name+' reopened for review.');render();candidateDetail();return}const a=b.dataset.act;if(a==='closeDrawer')closeDrawer();if(a==='previewCandidate'){selectedId=detailId;setMode('candidate')}if(a==='reminder')reminder();if(a==='requirements')requirements();if(a==='saveRequirements')saveRequirements();if(a==='closeModal')$('#modal').close();if(a==='demoBatch')demoBatch();if(a==='submit')submit();if(a==='browse'){pendingDoc='';$('#files').click()}if(a==='clearQueue'){queue=[];$('#queue').innerHTML=queueHtml()}if(a==='clearFilters'){search='';vacancyFilter='';ownerFilter='';quick='';render()}if(a==='csv')csv();if(a==='save')save();if(a==='import')$('#importFile').click();if(a==='help')modal('Example support message','<p class="smalltext">“I need help providing my documents. Could you explain which evidence is required or arrange an alternative way to submit it?”</p><p class="muted smalltext">In a live service, this would use the college’s approved recruitment contact details.</p>');if(a==='copyReminder'){const t=$('#reminderText');if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('Draft copied. No message sent.')).catch(()=>{t.select();toast('Select and copy the draft text.')});else{t.select();toast('Select and copy the draft text.')}}if(a==='recordReminder'){const c=byId(detailId);c.lastReminder=now();log(c,'Reminder recorded as simulated. No message was sent.');$('#modal').close();candidateDetail();toast('Simulated reminder recorded.')}});
$('#content').addEventListener('input',ev=>{if(ev.target.id==='search'){search=ev.target.value;$('#results').innerHTML=results()}});
$('#content').addEventListener('change',ev=>{const t=ev.target;if(t.id==='vacancyFilter'){vacancyFilter=t.value;$('#results').innerHTML=results()}if(t.id==='ownerFilter'){ownerFilter=t.value;$('#results').innerHTML=results()}if(t.id==='candidateSelect'){selectedId=t.value;queue=[];render()}if(t.hasAttribute('data-map'))queue[+t.dataset.map].key=t.value});
$('#files').onchange=ev=>{receiveFiles(ev.target.files);ev.target.value=''};$('#importFile').onchange=ev=>{openProgress(ev.target.files[0]);ev.target.value=''};$('#hrNav').onclick=()=>setMode('hr');$('#candidateNav').onclick=()=>setMode('candidate');$('#guideNav').onclick=guide;$('#reset').onclick=()=>{if(confirm('Reset all fictional records and clear current demo progress?')){candidates=seed();selectedId=candidates[0].id;search='';quick='';vacancyFilter='';ownerFilter='';queue=[];dirty=false;closeDrawer();render();toast('Demo reset to its starting records.')}};
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&detailId&&!$('#modal').open)closeDrawer();if(ev.key==='Tab'&&detailId&&!$('#modal').open){const els=[...document.querySelectorAll('.drawer button,.drawer textarea,.drawer input,.drawer select')].filter(x=>!x.disabled);const first=els[0],last=els.at(-1);if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}}});window.addEventListener('beforeunload',ev=>{if(dirty){ev.preventDefault();ev.returnValue=''}});render();
</script></body></html>
